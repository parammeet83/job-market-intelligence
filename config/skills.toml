# Versioned skill dictionary. Bump `version` whenever aliases or rules change; extraction
# results are stored with the version that produced them (job_skills.dictionary_version).
#
# Matching rules (backend/ingestion/skills/extractor.py):
#  * `aliases` match case-insensitively; `cs_aliases` match case-sensitively.
#  * Every alias is bounded: it may not be preceded or followed by a letter, digit, "_", "+", "#"
#    and may not be followed by ".<alnum>" (so "Node.js" != "Node", "GitHub" != "Git").
#  * `not_followed_by` is an optional regex that vetoes a match (e.g. "excel at").
version = "2026.10.1"

categories = [
  "Programming languages", "Data analysis", "Databases & SQL", "BI & visualization",
  "Machine learning", "Data engineering", "Cloud & DevOps", "Spreadsheets & office",
]

# --- Programming languages ---
[[skills]]
slug = "python"
name = "Python"
category = "Programming languages"
aliases = ["python", "python3"]

[[skills]]
slug = "r"
name = "R"
category = "Programming languages"
cs_aliases = ["R", "RStudio", "R Studio"]
# Avoid "R&D", "R'"; standalone capital R remains a known low-precision alias.
not_followed_by = '\s*(?:&|\x27|/D\b)'

