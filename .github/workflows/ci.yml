name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jmp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI database only; no project secrets are used in CI.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jmp_test
      APP_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies (locked)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check backend migrations
      - name: Ruff format check
        run: uv run ruff format --check backend migrations
      - name: Mypy
        run: uv run mypy
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic -x url=$TEST_DATABASE_URL upgrade head
          uv run alembic -x url=$TEST_DATABASE_URL check
        env:
          EXPECTED_DATABASE_NAME: jmp_test
      - name: Tests (unit + PostgreSQL integration)
        run: uv run pytest -q --cov=backend --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks binary (checksum-verified) scanning the full history. The gitleaks-action
      # scans "<first pushed commit>^..HEAD", which errors on a repository's root commit.
      - name: Install gitleaks
        run: |
          V=8.30.1
          BASE=https://github.com/gitleaks/gitleaks/releases/download/v$V
          curl -sSfL -o gitleaks.tar.gz "$BASE/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "$BASE/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz$" checksums.txt | sed 's/ .*/  gitleaks.tar.gz/' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan git history for secrets
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
