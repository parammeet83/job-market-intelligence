name: Production smoke test

# Runs the Playwright suite against the deployed dashboard and API (read-only requests).
on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * *" # after the daily ingestion

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.DASHBOARD_URL != '' && vars.API_URL != ''
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: ${{ vars.DASHBOARD_URL }}
      E2E_API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=list
