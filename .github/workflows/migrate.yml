name: Database migration (manual)

# Applies reviewed Alembic migrations to production. Never runs automatically.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to apply migrations to the production database'
        required: true
      reprovision_roles:
        description: "Re-apply role grants after the migration (needs JMP_*_PASSWORD secrets)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migration
  cancel-in-progress: false

jobs:
  migrate:
    if: inputs.confirm == 'migrate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      EXPECTED_DATABASE_NAME: ${{ secrets.EXPECTED_DATABASE_NAME }}
      APP_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --no-dev
      - name: Show current revision (env.py aborts if the database name is unexpected)
        run: uv run alembic current
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Re-apply role grants
        if: inputs.reprovision_roles
        env:
          JMP_API_RO_PASSWORD: ${{ secrets.JMP_API_RO_PASSWORD }}
          JMP_INGEST_PASSWORD: ${{ secrets.JMP_INGEST_PASSWORD }}
        run: uv run python -m backend.ops.roles provision
